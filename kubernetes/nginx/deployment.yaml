apiVersion: apps/v1
kind: Deployment
metadata:
  name: peach-cheesecake
  namespace: nginx-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: peach-cheesecake
  template:
    metadata:
      labels:
        app: peach-cheesecake
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: site-content
          configMap:
            name: peach-cheesecake-site
